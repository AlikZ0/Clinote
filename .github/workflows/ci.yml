name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The API suite runs once per storage adapter; without these the PostgreSQL
    # and object-store adapters would silently go untested.
    #
    # MinIO is started as a step rather than a service: a service container
    # takes no command, and this image needs `server /data`. As a service it
    # printed its usage and exited, and a service that fails to start fails the
    # job before the first step runs.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinote
          POSTGRES_PASSWORD: clinote
          POSTGRES_DB: clinote_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U clinote -d clinote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1125:1025
          - 8125:8025

    env:
      TEST_DATABASE_URL: postgres://clinote:clinote@127.0.0.1:5433/clinote_test
      TEST_S3_ENDPOINT: http://127.0.0.1:9100
      TEST_SMTP_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=clinote \
            -e MINIO_ROOT_PASSWORD=clinote-secret \
            minio/minio:latest server /data

          # Readiness is checked from the runner, which has curl; the server
          # image is not required to.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9100/minio/health/live; then
              echo "MinIO is ready"
              exit 0
            fi
            sleep 1
          done

          echo "MinIO did not become ready" >&2
          docker logs minio >&2
          exit 1

      - name: Create the backup bucket
        run: |
          docker run --rm --network host minio/mc:latest /bin/sh -c "
            mc alias set ci http://127.0.0.1:9100 clinote clinote-secret &&
            mc mb --ignore-existing ci/clinote-backups
          "

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
